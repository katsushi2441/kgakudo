<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ site }}{% endblock %}</title>
<meta name="description" content="{% block desc %}住所を入れると、その自治体の学童保育（放課後児童クラブ）のクラブ数・登録児童数・待機児童数が分かります。出典はこども家庭庁の全国調査です。{% endblock %}">
<link rel="canonical" href="{{ base }}{{ canon|default('/') }}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:description" content="{{ self.desc() }}">
<meta property="og:type" content="website">
<style>
:root{--ink:#12202f;--mut:#5d6b7a;--teal:#0a9a8f;--teal-d:#087f76;--line:#dfe7ec;--bg:#f5f8fa;--card:#fff;--red:#c0392b;--red-l:#fdecea;--amber:#b7791f;--amber-l:#fdf6e3;--blue:#2c6fbb;--blue-l:#eaf2fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.8 "Noto Sans JP",system-ui,sans-serif}
a{color:var(--teal-d)}
.wrap{width:min(940px,100% - 32px);margin:0 auto}
header{background:#fff;border-bottom:1px solid var(--line)}
.brand{display:block;padding:14px 0 6px;font-weight:800;font-size:18px;text-decoration:none;color:var(--ink)}
.menu{display:flex;gap:14px;flex-wrap:wrap;padding-bottom:12px;font-size:14px}
.menu a{text-decoration:none;color:var(--mut)}.menu a.on{color:var(--teal-d);font-weight:700}
main{padding:22px 0 40px}
h1{font-size:26px;line-height:1.4;margin:0 0 10px}h2{font-size:20px;margin:26px 0 10px}
.lead{color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;min-width:0}
.card.none{background:#fbfcfd}.card.lv2{border-color:#e6c98b;background:var(--amber-l)}.card.lv3{border-color:#e3a9a1;background:var(--red-l)}
.card .k{font-size:12px;color:var(--mut)}.card .v{font-size:22px;font-weight:800;margin-top:4px}.card .s{font-size:12px;color:var(--mut);margin-top:4px}
.pol{border:2px solid var(--line);border-radius:14px;padding:16px;font-weight:800;font-size:18px;background:#fff}
.pol.ok{border-color:#bfe3de;background:#f2fbf9}
.pol small{display:block;font-weight:400;font-size:14px;color:var(--mut);margin-top:6px;line-height:1.8}
.src{font-size:12.5px;color:var(--mut);line-height:1.8}
.btn{display:inline-block;background:var(--teal);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.ghost{background:#fff;color:var(--teal-d);border:1px solid var(--line)}
input[type=text]{flex:1 1 260px;min-width:0;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:10px}
.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{color:var(--mut);font-size:12px;font-weight:700}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--mut);font-size:13px;background:#fff}
ul.plain{margin:0;padding-left:20px}
</style>
</head>
<body>
<header><div class="wrap">
<a class="brand" href="{{ base }}/">{{ site }}</a>
<nav class="menu">
<a href="{{ base }}/" class="{{ 'on' if nav=='home' }}">住所で調べる</a>
<a href="{{ base }}/waiting50" class="{{ 'on' if nav=='waiting50' }}">待機が多い市町村</a>
<a href="{{ base }}/data" class="{{ 'on' if nav=='data' }}">データ配布</a>
<a href="{{ base }}/about" class="{{ 'on' if nav=='about' }}">このデータについて</a>
</nav>
</div></header>
<main><div class="wrap">{% block body %}{% endblock %}</div></main>
<footer><div class="wrap">
<div>出典: こども家庭庁「放課後児童健全育成事業（放課後児童クラブ）の実施状況」（{{ nat.as_of }}現在）を加工して作成。当社は国が公表していない数字を推定しません。</div>
<div style="margin-top:6px">関連: <a href="{{ links.kflood }}">洪水・内水ハザードマップ</a>／<a href="{{ links.komon }}" target="_blank" rel="noopener">AI-IT顧問契約</a></div>
</div></footer>
</body>
</html>
